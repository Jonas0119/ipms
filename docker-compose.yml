version: '3.8'

services:
  mysql57:
    image: mysql:5.7
    container_name: mysql57
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: Tjfae@123
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      ipms_network:
        ipv4_address: 172.17.0.2
    volumes:
      - mysql_data:/var/lib/mysql

  my-redis:
    image: redis:6.2.6
    container_name: my-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      ipms_network:
        ipv4_address: 172.17.0.3
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    container_name: minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    networks:
      ipms_network:
        ipv4_address: 172.17.0.4
    volumes:
      - minio_data:/data
      - minio_config:/root/.minio

  api-server1:
    image: node:24.2.0
    container_name: api-server1
    restart: always
    ports:
      - "6688:6688"
    working_dir: /www/apiserver
    command: sh -c "echo '开始安装依赖...' && npm install && echo '依赖安装完成，等待5秒...' && sleep 5 && echo '启动服务器...' && node ipms_server.js"
    networks:
      ipms_network:
        ipv4_address: 172.17.0.5
    volumes:
      - ./api-server/dist:/www/apiserver
    depends_on:
      - mysql57
      - my-redis
      - minio

  my-nginx1:
    image: nginx
    container_name: my-nginx1
    restart: always
    ports:
      - "8080:80"
    networks:
      ipms_network:
        ipv4_address: 172.17.0.6
    volumes:
      - ./console-web/nginx-conf/custom.conf:/etc/nginx/conf.d/default.conf
      - ./console-web/dist:/usr/share/nginx/html
    depends_on:
      - api-server1

networks:
  ipms_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.17.0.0/16
          gateway: 172.17.0.1

volumes:
  mysql_data:
  redis_data:
  minio_data:
  minio_config:
